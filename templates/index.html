
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Tweet Classifier</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            resize: vertical;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font: inherit;
            line-height: 1.5;
        }

        textarea:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 22px;
            padding: 16px;
            border-radius: 10px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            text-align: center;
        }

        .result h2 {
            margin: 0 0 6px;
            font-size: 20px;
        }

        .result p {
            margin: 0;
            color: #475569;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <h1>Disaster Tweet Classifier</h1>

        <p class="subtitle">
            Enter a tweet to classify it as disaster-related
            or non-disaster.
        </p>

        <form method="POST">
            <label for="tweet">Tweet text</label>

            <textarea
                id="tweet"
                name="tweet"
                placeholder="Paste a tweet here..."
                required>{{ tweet }}</textarea>

            <button type="submit">Classify Tweet</button>
        </form>

        {% if prediction %}
        <section class="result" aria-live="polite">
            <h2>Prediction: {{ prediction }}</h2>
            <p>
                This result is generated by the trained
                machine learning model.
            </p>
        </section>
        {% endif %}

        <p class="footer">
            NLP Mini Project · Disaster Tweet Classification
        </p>

    </main>
</body>
</html>
